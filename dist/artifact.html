/* Layout: one-screen console cabinet. Supply-closet label bar on top,
   the game's own Windows console in the middle, credits at the foot. */
:root {
  --bg: #0e1110;          /* closet-dark, faint green bias */
  --screen: #0c0c0c;      /* Windows console black */
  --panel: #151a18;
  --rule: #29312d;
  --fg: #d9e1dc;
  --muted: #8d9993;
  --bucket: #f2c230;      /* mop-bucket yellow: the one loud thing */
  --ok: #16c60c;          /* console bright green: "your turn" */
  --font-display: "Big Shoulders Stencil Display", "Impact", "Arial Narrow Bold", sans-serif;
  --font-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-term: "IBM Plex Mono", "Cascadia Mono", Consolas, "Courier New", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.45 var(--font-ui);
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  gap: 10px;
  box-sizing: border-box;
  overflow: hidden;
}
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
}
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; margin-right: auto; }
.brand h1 {
  margin: 0;
  font: 800 2.1rem/0.9 var(--font-display);
  letter-spacing: 0.02em;
  color: var(--bucket);
  text-transform: uppercase;
}
.edition {
  display: inline-block;
  vertical-align: 0.32em;
  margin-left: 4px;
  padding: 3px 7px 2px;
  font: 800 0.8rem/1 var(--font-display);
  letter-spacing: 0.08em;
  color: var(--screen);
  background: var(--bucket);
  border-radius: 3px;
  transform: rotate(-3deg);
}
.brand p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.version {
  font: 600 0.75rem var(--font-term);
  letter-spacing: 0.04em;
  color: var(--muted);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 2px 6px;
  white-space: nowrap;
}
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.status {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 0.8rem; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600;
  color: var(--muted);
  padding: 5px 10px; border: 1px solid var(--rule); border-radius: 999px;
  white-space: nowrap;
}
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status[data-state="line"] { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, var(--rule)); }
.status[data-state="line"]::before { background: var(--ok); }
.status[data-state="key"] { color: var(--bucket); border-color: color-mix(in srgb, var(--bucket) 45%, var(--rule)); }
.status[data-state="key"]::before { background: var(--bucket); animation: blink 1s steps(2) infinite; }
.status[data-state="done"]::before { background: var(--rule); }
@keyframes blink { 50% { opacity: 0.2; } }
select, button {
  font: 600 0.85rem var(--font-ui);
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
}
button:hover, select:hover { border-color: var(--muted); }
:focus-visible { outline: 2px solid var(--bucket); outline-offset: 2px; }
label.speed { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.85rem; }

.cabinet {
  flex: 1;
  min-height: 0;
  background: var(--screen);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 10px 4px 10px 12px;
  position: relative;
}
#term { height: 100%; }
.loading {
  position: absolute; inset: 0; display: grid; place-items: center;
  color: var(--muted); font: 0.95rem var(--font-term);
}
.error { color: #e74856; padding: 0 12px; text-align: center; }

.touch-input { display: none; gap: 8px; }
.touch-input input {
  flex: 1; min-width: 0;
  font: 16px var(--font-term);
  color: var(--fg); background: var(--panel);
  border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px;
}
.touch-input .go { background: var(--bucket); color: #111; border-color: var(--bucket); }
@media (pointer: coarse) { .touch-input { display: flex; } }

.foot {
  display: flex; flex-wrap: wrap; gap: 4px 18px; justify-content: space-between;
  color: var(--muted); font-size: 0.8rem;
}
.foot strong { color: var(--fg); font-weight: 600; }
kbd {
  font: 600 0.75rem var(--font-term);
  border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px;
  padding: 0 5px; color: var(--fg);
}
@media (max-width: 560px) {
  .brand h1 { font-size: 1.7rem; }
  .brand p { display: none; }
  .speed-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  body { padding-block: 8px; gap: 8px; }
}
.pad {
  display: grid;
  grid-template-columns: repeat(3, 56px) auto;
  grid-template-areas: ". up . quit" "left down right quit";
  gap: 6px;
  justify-content: center;
}
.pad[hidden] { display: none; }
.pad button { height: 48px; font-size: 1.1rem; touch-action: manipulation; }
.pad button[aria-label="Up"] { grid-area: up; }
.pad button[aria-label="Left"] { grid-area: left; }
.pad button[aria-label="Down"] { grid-area: down; }
.pad button[aria-label="Right"] { grid-area: right; }
.pad .quit { grid-area: quit; margin-left: 10px; height: auto; }
@media (prefers-reduced-motion: reduce) { .status[data-state="key"]::before { animation: none; } }

<script>
// Runs the Mop Mania WebAssembly build in a browser (or Node for testing).
//
// The game is ordinary C++ that blocks on std::cin and sleeps between lines.
// The wasm was processed with Binaryen's Asyncify pass, so whenever the game
// waits (reading input, sleeping, "Press any key"), this runtime pauses it,
// lets the page keep running, and resumes it when the wait is over.
(function (root) {
  "use strict";

  const ERRNO = { SUCCESS: 0, BADF: 8, INVAL: 28, NOENT: 44, NOSYS: 52 };
  const FILETYPE = { CHAR: 2, DIR: 3, FILE: 4 };
  const PREOPEN_FD = 3;

  class ExitSignal { constructor(code) { this.code = code; } }

  class MopManiaRuntime {
    /**
     * opts.wasm      ArrayBuffer | Uint8Array | WebAssembly.Module
     * opts.files     { "endcredit.txt": "..." } readable from the game
     * opts.write     (text) => void       terminal output
     * opts.play      (name, loop) => void sound request ("void.wav", ...)
     * opts.stop      () => void
     * opts.onWait    (kind) => void       "line" | "key" | null
     * opts.speed     multiplier for sleeps (1 = original pacing)
     */
    constructor(opts) {
      this.opts = Object.assign({ files: {}, speed: 1, write() {}, play() {}, stop() {}, onWait() {}, lockInput() {}, onRealtime() {} }, opts);
      this.realtime = false;
      this.keyBytes = [];
      this.inputLocked = false;
      this.stdin = [];          // queued bytes the game has not read yet
      this.lineWaiter = null;
      this.keyWaiter = null;
      this.sleepCancel = null;
      this.closed = false;
      this.encoder = new TextEncoder();
      this.decoder = new TextDecoder("utf-8");
      this.fds = new Map();
      this.nextFd = PREOPEN_FD + 1;
      this.finished = false;
    }

    // ------------------------------------------------------------ input ---
    get waitingFor() { return this.keyWaiter ? "key" : this.lineWaiter ? "line" : null; }

    /** Give the game a typed line (without the newline). */
    sendLine(text) {
      if (this.inputLocked) return;
      for (const b of this.encoder.encode(text + "\n")) this.stdin.push(b);
      if (this.lineWaiter) { const w = this.lineWaiter; this.lineWaiter = null; w(); }
    }

    /** Answer a "Press any key to continue" prompt. Returns true if one was waiting. */
    pressKey() {
      if (!this.keyWaiter) return false;
      const w = this.keyWaiter; this.keyWaiter = null; w(); return true;
    }

    /** Send raw key data during a real-time section (the snake game). */
    sendKeys(data) {
      if (!this.realtime) return false;
      for (const b of this.encoder.encode(data)) this.keyBytes.push(b);
      return true;
    }

    /** Cut the current pause in the text short (used for "skip"). */
    skipDelay() { if (this.sleepCancel) this.sleepCancel(); }

    /** Make further reads return end-of-file (Node tests). */
    closeInput() {
      this.closed = true;
      if (this.lineWaiter) { const w = this.lineWaiter; this.lineWaiter = null; w(); }
      if (this.keyWaiter) { const w = this.keyWaiter; this.keyWaiter = null; w(); }
    }

    setSpeed(s) { this.opts.speed = s; }

    /** Stop this game for good (used by Restart). It never resumes or prints again. */
    abort() {
      this.dead = true;
      const noop = () => {};
      this.opts.write = noop; this.opts.play = noop; this.opts.onWait = noop;
      try { this.opts.stop(); } catch (e) {}
      this.opts.stop = noop;
      this.lineWaiter = this.keyWaiter = this.sleepCancel = null;
    }

    // --------------------------------------------------------- memory -----
    get mem() { return new DataView(this.memory.buffer); }
    get bytes() { return new Uint8Array(this.memory.buffer); }

    readIovs(iovs, len) {
      const out = [], dv = this.mem;
      for (let i = 0; i < len; i++) {
        out.push({ ptr: dv.getUint32(iovs + i * 8, true), len: dv.getUint32(iovs + i * 8 + 4, true) });
      }
      return out;
    }

    copyIn(iovs, iovsLen, source, nreadPtr) {
      let n = 0;
      const mem = this.bytes;
      for (const { ptr, len } of this.readIovs(iovs, iovsLen)) {
        const take = Math.min(len, source.length - n);
        for (let i = 0; i < take; i++) mem[ptr + i] = source[n + i];
        n += take;
        if (take < len) break;
      }
      this.mem.setUint32(nreadPtr, n, true);
      return n;
    }

    // ----------------------------------------------------------- WASI -----
    wasi() {
      const self = this;
      return {
        args_get: () => ERRNO.SUCCESS,
        args_sizes_get(argc, bufSize) { self.mem.setUint32(argc, 0, true); self.mem.setUint32(bufSize, 0, true); return 0; },
        environ_get: () => ERRNO.SUCCESS,
        environ_sizes_get(count, size) { self.mem.setUint32(count, 0, true); self.mem.setUint32(size, 0, true); return 0; },
        clock_time_get(id, precision, out) {
          const ns = BigInt(Math.round((id === 0 ? Date.now() : performance.now()) * 1e6));
          self.mem.setBigUint64(out, ns, true); return 0;
        },
        clock_res_get(id, out) { self.mem.setBigUint64(out, 1000n, true); return 0; },
        random_get(ptr, len) {
          const buf = self.bytes.subarray(ptr, ptr + len);
          for (let i = 0; i < len; i += 65536) crypto.getRandomValues(buf.subarray(i, Math.min(len, i + 65536)));
          return 0;
        },
        proc_exit(code) { throw new ExitSignal(code); },
        sched_yield: () => 0,

        fd_write(fd, iovs, iovsLen, nwritten) {
          let total = 0;
          if (fd === 1 || fd === 2) {
            let text = "";
            for (const { ptr, len } of self.readIovs(iovs, iovsLen)) {
              text += self.decoder.decode(self.bytes.slice(ptr, ptr + len), { stream: true });
              total += len;
            }
            text = text.replace(/﻿/g, "");
            if (text) self.opts.write(text);
          } else {
            return ERRNO.BADF;
          }
          self.mem.setUint32(nwritten, total, true);
          return 0;
        },

        fd_read(fd, iovs, iovsLen, nread) {
          if (fd === 0) {
            if (self.stdin.length || self.closed) {
              const n = self.copyIn(iovs, iovsLen, self.stdin, nread);
              self.stdin.splice(0, n);
              return 0;
            }
            // Nothing typed yet: pause the game until a line arrives.
            return new Promise((resolve) => {
              self.lineWaiter = resolve;
              self.opts.onWait("line");
            }).then(() => {
              self.opts.onWait(null);
              const n = self.copyIn(iovs, iovsLen, self.stdin, nread);
              self.stdin.splice(0, n);
              return 0;
            });
          }
          const f = self.fds.get(fd);
          if (!f) return ERRNO.BADF;
          const n = self.copyIn(iovs, iovsLen, f.data.subarray(f.pos), nread);
          f.pos += n;
          return 0;
        },

        poll_oneoff(inPtr, outPtr, nsubs, neventsPtr) {
          // The game only ever sleeps on a single clock (nanosleep).
          const dv = self.mem;
          let ms = 0, userdata = 0n;
          for (let i = 0; i < nsubs; i++) {
            const s = inPtr + i * 48;
            if (dv.getUint8(s + 8) === 0) {
              userdata = dv.getBigUint64(s, true);
              ms = Math.max(ms, Number(dv.getBigUint64(s + 24, true)) / 1e6);
            }
          }
          const finish = () => {
            const d = self.mem;
            d.setBigUint64(outPtr, userdata, true);
            d.setUint16(outPtr + 8, 0, true);
            d.setUint8(outPtr + 10, 0);
            d.setUint32(neventsPtr, 1, true);
            return 0;
          };
          const wait = ms * self.opts.speed;
          if (wait < 1) return finish();
          return new Promise((resolve) => {
            const t = setTimeout(done, wait);
            function done() { clearTimeout(t); self.sleepCancel = null; if (!self.dead) resolve(); }
            self.sleepCancel = done;
          }).then(finish);
        },

        fd_close(fd) { return self.fds.delete(fd) ? 0 : (fd <= PREOPEN_FD ? 0 : ERRNO.BADF); },
        fd_fdstat_get(fd, out) {
          const dv = self.mem;
          let type;
          if (fd <= 2) type = FILETYPE.CHAR;
          else if (fd === PREOPEN_FD) type = FILETYPE.DIR;
          else if (self.fds.has(fd)) type = FILETYPE.FILE;
          else return ERRNO.BADF;
          dv.setUint8(out, type);
          dv.setUint16(out + 2, 0, true);
          dv.setBigUint64(out + 8, 0xFFFFFFFFFFFFFFFFn, true);
          dv.setBigUint64(out + 16, 0xFFFFFFFFFFFFFFFFn, true);
          return 0;
        },
        fd_fdstat_set_flags: () => 0,
        fd_prestat_get(fd, out) {
          if (fd !== PREOPEN_FD) return ERRNO.BADF;
          self.mem.setUint8(out, 0);
          self.mem.setUint32(out + 4, 1, true);
          return 0;
        },
        fd_prestat_dir_name(fd, ptr, len) {
          if (fd !== PREOPEN_FD) return ERRNO.BADF;
          self.bytes[ptr] = 46; // "."
          return 0;
        },
        fd_seek(fd, offset, whence, out) {

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status"), speedEl = $("speed"), soundBtn = $("sound");
  const touchForm = $("touch"), touchText = $("touch-text"), touchSend = $("touch-send");

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  function b64bytes(b64) {
    const bin = atob(b64), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function loadWasm() {
    const gz = b64bytes(WASM_GZ_B64);
    const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));
    const bytes = await new Response(stream).arrayBuffer();
    return WebAssembly.compile(bytes);
  }

  // ---- terminal ------------------------------------------------------
  // Colors are the Windows console ("Campbell") palette the game was written for.
  const narrow = window.matchMedia("(max-width: 560px)").matches;
  const term = new Terminal({
    convertEol: true,
    cursorBlink: true,
    fontFamily: '"IBM Plex Mono", "Cascadia Mono", Consolas, "Courier New", monospace',
    fontSize: narrow ? 11 : 15,
    lineHeight: 1.15,
    scrollback: 5000,
    theme: {
      background: "#0c0c0c", foreground: "#cccccc", cursor: "#f2c230", cursorAccent: "#0c0c0c",
      selectionBackground: "#3a3a3a",
      black: "#0c0c0c", red: "#c50f1f", green: "#13a10e", yellow: "#c19c00",
      blue: "#0037da", magenta: "#881798", cyan: "#3a96dd", white: "#cccccc",
      brightBlack: "#767676", brightRed: "#e74856", brightGreen: "#16c60c", brightYellow: "#f9f1a5",
      brightBlue: "#3b78ff", brightMagenta: "#b4009e", brightCyan: "#61d6d6", brightWhite: "#f2f2f2",
    },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);

  // ---- sound ---------------------------------------------------------
  // Plays sounds/<name>.wav if those files sit next to this page.
  // The original .wav files were never committed, so this is often silent;
  // the Sound button only appears once a file actually loads.
  let audio = null, soundOn = store.get("mm-sound") !== "off";
  function stopSound() { if (audio) { audio.pause(); audio.src = ""; audio = null; } }
  function playSound(name, loop) {
    stopSound();
    const a = new Audio("sounds/" + encodeURIComponent(name));
    a.loop = loop;
    a.muted = !soundOn;
    a.addEventListener("canplay", () => { soundBtn.hidden = false; }, { once: true });
    a.addEventListener("error", () => {}, { once: true });
    audio = a;
    a.play().catch(() => {});
  }
  function renderSound() {
    soundBtn.textContent = soundOn ? "Sound on" : "Sound off";
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    if (audio) audio.muted = !soundOn;
  }
  soundBtn.addEventListener("click", () => { soundOn = !soundOn; store.set("mm-sound", soundOn ? "on" : "off"); renderSound(); });
  renderSound();

  // ---- status --------------------------------------------------------
  const STATUS = { line: "Your answer", key: "Press any key", busy: "Story playing", done: "Game over" };
  function setStatus(state) {
    statusEl.dataset.state = state;
    statusEl.textContent = STATUS[state];
    touchSend.textContent = state === "key" ? "Continue" : "Enter";
  }

  // ---- game ----------------------------------------------------------
  let rt = null, module = null, line = "";
  const savedSpeed = store.get("mm-speed");
  if (savedSpeed !== null && [...speedEl.options].some((o) => o.value === savedSpeed)) speedEl.value = savedSpeed;

  async function start() {
    if (rt) rt.abort();
    stopSound();
    term.reset();
    line = "";
    setStatus("busy");
    const game = new MopManiaRuntime({
      wasm: module,
      files: { "endcredit.txt": b64bytes(ENDCREDIT_B64) },
      speed: Number(speedEl.value),
      write: (t) => term.write(t),
      play: playSound,
      stop: stopSound,
      onWait: (kind) => setStatus(kind || "busy"),
      lockInput: (locked) => { if (locked) { line = ""; touchText.value = ""; } },
      onRealtime: (on) => { pad.hidden = !on; touchForm.hidden = on; line = ""; if (on && !coarse) term.focus(); },
    });
    rt = game;
    try {
      await game.run();
      if (rt === game) {
        setStatus("done");
        term.write("\r\n\x1b[90m[The game has ended. Press Restart to play again.]\x1b[0m\r\n");
      }
    } catch (e) {
      if (rt === game) {
        setStatus("done");
        term.write("\r\n\x1b[91m[The game stopped unexpectedly: " + (e && e.message ? e.message : e) + ". Press Restart to play again.]\x1b[0m\r\n");
      }
    }
  }

  // Typing in the console: the line is echoed and sent on Enter.
  term.onData((data) => {
    if (!rt || rt.finished) return;
    if (rt.realtime) { rt.sendKeys(data); return; }   // snake game: every key goes straight in
    if (rt.inputLocked) return;
    if (rt.waitingFor === "key") { rt.pressKey(); return; }
    if (data.charCodeAt(0) === 27) return; // arrow keys etc.
    for (const ch of data) {
      if (ch === "\r") { term.write("\r\n"); const l = line; line = ""; rt.sendLine(l); }
      else if (ch === "\x7f" || ch === "\b") { if (line) { line = line.slice(0, -1); term.write("\b \b"); } }
      else if (ch >= " ") { line += ch; term.write(ch); }
    }
  });

  // Phones: answer through the input bar under the console.
  touchForm.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!rt || rt.finished || rt.inputLocked) return;
    if (rt.waitingFor === "key") { rt.pressKey(); touchText.value = ""; return; }
    const v = line + touchText.value;
    term.write(touchText.value + "\r\n");
    line = "";
    touchText.value = "";
    rt.sendLine(v);
    touchText.focus();
  });

  // On-screen arrows for the snake game (phones, or anyone who prefers clicking)
  const pad = $("pad");
  const coarse = window.matchMedia("(pointer: coarse)").matches;
  pad.addEventListener("pointerdown", (e) => {
    const b = e.target.closest("button[data-key]");
    if (!b || !rt) return;
    e.preventDefault();
    rt.sendKeys(b.dataset.key);
  });

  speedEl.addEventListener("change", () => {
    store.set("mm-speed", speedEl.value);
    if (rt) rt.setSpeed(Number(speedEl.value));
  });
  $("restart").addEventListener("click", () => { start(); term.focus(); });

  const refit = () => { try { fit.fit(); } catch (e) {} };
  window.addEventListener("resize", refit);
  if (window.ResizeObserver) new ResizeObserver(refit).observe($("term"));

  (async function boot() {
    try {
      if (document.fonts && document.fonts.load) {
        await Promise.race([document.fonts.load('15px "IBM Plex Mono"'), new Promise((r) => setTimeout(r, 1500))]);
      }
      term.open($("term"));
      refit();
      module = await loadWasm();
      $("loading").hidden = true;
      if (!window.matchMedia("(pointer: coarse)").matches) term.focus();
      start();
    } catch (e) {
      $("loading").innerHTML = '<p class="error">Mop Mania Ultra Deluxe could not load in this browser (' +
        String(e && e.message ? e.message : e).replace(/[<>&]/g, "") +
        "). Try a current version of Chrome, Edge, Firefox or Safari.</p>";
      setStatus("done");
    }
  })();
})();
